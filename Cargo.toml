[package]
name = "gitpp"
version = "0.1.0"
edition = "2021"
description = "A 4th port of the git.pp fold in Rust, written from the public spec alone."
license = "MIT OR Apache-2.0"
repository = "https://github.com/SuperInstance/gitpp-rust"

[lib]
name = "gitpp"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
indexmap = "2"

[dev-dependencies]
